<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPulse - Follow-up & Holiday Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        html { color-scheme: light; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #e6eeff;
            color: #07102b;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== text colors (high contrast on frost glass) ===== */
        .text-ink  { color: #07102b; }
        .text-sub  { color: #334155; }
        .text-sub2 { color: #475569; }
        .text-acc  { color: #1d4ed8; }
        .text-amb  { color: #92400e; }
        .text-emr  { color: #047857; }
        .text-ros  { color: #be123c; }
        .text-on   { color: #ffffff; }

        /* ================= LIQUID BACKDROP ================= */
        .lg-backdrop {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(160deg, #eaf1ff 0%, #e2ebfc 50%, #f1e9fb 100%);
        }
        .lg-orb { position: absolute; border-radius: 9999px; filter: blur(70px); will-change: transform; }
        .lg-orb.o1 { width: max(300px, 30vmax); height: max(300px, 30vmax); top: -8%; left: -6%;
            background: #4f8dff; opacity: .55; animation: drift1 24s ease-in-out infinite alternate; }
        .lg-orb.o2 { width: max(320px, 32vmax); height: max(320px, 32vmax); bottom: -12%; right: -8%;
            background: #ff8fc2; opacity: .5; animation: drift2 28s ease-in-out infinite alternate; }
        .lg-orb.o3 { width: max(220px, 22vmax); height: max(220px, 22vmax); top: 42%; left: 48%;
            background: #ffd166; opacity: .45; animation: drift3 26s ease-in-out infinite alternate; }
        .lg-orb.o4 { width: max(240px, 24vmax); height: max(240px, 24vmax); top: 55%; left: -6%;
            background: #7dd3fc; opacity: .4; animation: drift2 30s ease-in-out infinite alternate-reverse; }
        @keyframes drift1 { to { transform: translate(8vw, 10vh) scale(1.12); } }
        @keyframes drift2 { to { transform: translate(-8vw, -9vh) scale(1.1); } }
        @keyframes drift3 { to { transform: translate(-10vw, 8vh) scale(1.15); } }
        @media (prefers-reduced-motion: reduce) { .lg-orb { animation: none !important; } }

        /* ================= GLASS SURFACES ================= */
        .glass {
            background: rgba(255, 255, 255, 0.62);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.18), inset 0 1px 0 #ffffff, inset 0 -1px 0 rgba(255,255,255,0.5);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.68);
            -webkit-backdrop-filter: blur(16px) saturate(170%);
            backdrop-filter: blur(16px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 24px rgba(30, 58, 138, 0.14), inset 0 1px 0 #ffffff;
        }
        .glass-inset {
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(15, 23, 42, 0.1);
            box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.06);
        }

        /* ================= BUTTONS ================= */
        .btn-glass {
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 6px 16px rgba(30, 58, 138, 0.28), inset 0 1px 0 rgba(255,255,255,0.55);
            text-shadow: 0 1px 1px rgba(0,0,0,0.2);
            transition: transform .15s ease, filter .2s ease;
        }
        .btn-glass:hover { filter: brightness(1.08); }
        .btn-glass:active { transform: scale(0.96); }
        .btn-emerald { background: linear-gradient(180deg, #10b981, #047857); }
        .btn-green   { background: linear-gradient(180deg, #22c55e, #15803d); }
        .btn-neutral { background: rgba(255,255,255,0.85); color: #0f172a; text-shadow: none; border-color: rgba(15,23,42,0.15); box-shadow: 0 4px 12px rgba(30,58,138,0.12), inset 0 1px 0 #fff; }

        .month-btn {
            width: 38px; height: 38px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 12px;
            color: #334155;
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(15,23,42,0.14);
            box-shadow: inset 0 1px 0 #fff, 0 3px 8px rgba(30,58,138,0.1);
            transition: all .2s ease;
        }
        .month-btn:hover { color: #1d4ed8; background: #ffffff; border-color: rgba(29,78,216,0.45); }
        .month-btn:active { transform: scale(0.94); }

        /* ================= CALENDAR ================= */
        .cal-cell { height: 56px; }
        .cal-empty { background: rgba(255,255,255,0.25); border: 1px dashed rgba(15,23,42,0.08); }
        .cal-day {
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(15, 23, 42, 0.1);
            color: #07102b;
            box-shadow: inset 0 1px 0 #ffffff;
            transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
        }
        .cal-day:hover { background: #ffffff; box-shadow: 0 4px 12px rgba(30,58,138,0.18), inset 0 1px 0 #fff; }
        .cal-day:active { transform: scale(0.96); }
        .cal-day > span:first-child { font-size: 15px; }
        .cal-selected {
            background: #ffffff;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.28), 0 6px 16px rgba(29,78,216,0.22);
        }
        .holiday-card {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(225, 29, 72, 0.4);
            color: #881337;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
        }
        .holiday-icon { background: rgba(225,29,72,0.16); color: #be123c; }

        /* ================= STATUS BADGES ================= */
        .badge { box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); border: 1px solid transparent; }
        .badge-new     { background: rgba(99,102,241,0.16); color: #3730a3; border-color: rgba(99,102,241,0.5); }
        .badge-follow  { background: rgba(245,158,11,0.24); color: #78350f; border-color: rgba(180,83,9,0.55); }
        .badge-closed  { background: rgba(14,165,233,0.17); color: #0c4a6e; border-color: rgba(2,132,199,0.5); }
        .pill-count { background: rgba(255,255,255,0.85); border: 1px solid rgba(15,23,42,0.12); color: #334155; }

        /* ================= NAV ================= */
        .nav-glass { border-radius: 26px; }
        .nav-item { padding: 6px 14px; border-radius: 18px; transition: background .2s ease, color .2s ease; }
        .nav-item.active {
            background: rgba(29, 78, 216, 0.12);
            border: 1px solid rgba(29, 78, 216, 0.35);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        /* ================= RESPONSIVE LAYOUT ================= */
        .page-wrap { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
        .nav-wrap { max-width: 28rem; }
        .cal-layout { display: block; }
        @media (min-width: 768px) {
            .page-wrap { max-width: none; }
            .nav-wrap { max-width: 34rem; }
            .cal-cell { height: 76px; }
            .cal-day > span:first-child { font-size: 17px; }
            #calendarDaysGrid { gap: 8px; }
        }
        @media (min-width: 1024px) {
            html { font-size: 17px; }
            .cal-layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
            .cal-side { position: sticky; top: 84px; max-height: calc(100vh - 190px); overflow-y: auto; }
        }
        @media (min-width: 1280px) {
            .cal-cell { height: 88px; }
        }

        /* ================= MISC ================= */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(15,23,42,0.25); border-radius: 9999px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::selection { background: rgba(29,78,216,0.25); }
    </style>
</head>
<body class="text-ink min-h-screen pb-32">

    <!-- LIQUID BACKDROP -->
    <div class="lg-backdrop" aria-hidden="true">
        <div class="lg-orb o1"></div>
        <div class="lg-orb o2"></div>
        <div class="lg-orb o3"></div>
        <div class="lg-orb o4"></div>
    </div>

    <!-- FLOATING TOP HEADER BAR -->
    <div class="sticky top-3 z-40 px-4 md:px-8 mb-3">
        <div class="page-wrap glass rounded-2xl px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-lg text-sub hover:text-blue-800"><i class="fa-solid fa-arrow-left"></i></a>
                <span class="text-xs font-bold text-acc">Calendar & Schedule (28 Columns)</span>
            </div>
            <div class="flex items-center space-x-2">
                <a href="summary.html" class="btn-glass btn-neutral text-xs font-bold px-3 py-1.5 rounded-xl">Summary</a>
            </div>
        </div>
    </div>

    <div class="page-wrap p-4 md:px-8 pt-1">

        <div class="cal-layout">

            <!-- LEFT: Calendar -->
            <div class="cal-main">
                <!-- Calendar Month Header Control -->
                <div class="glass p-4 rounded-3xl mb-4 flex justify-between items-center">
                    <button onclick="changeMonth(-1)" class="month-btn">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <h2 id="calendarMonthTitle" class="text-sm md:text-base font-extrabold text-acc tracking-wide uppercase">Month Year</h2>
                    <button onclick="changeMonth(1)" class="month-btn">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <!-- Calendar Grid Container -->
                <div class="glass p-4 rounded-3xl mb-6">
                    <!-- Days of Week Header -->
                    <div class="grid grid-cols-7 gap-1 text-center mb-3">
                        <span class="text-xs font-extrabold text-ros uppercase">S</span>
                        <span class="text-xs font-extrabold text-sub2 uppercase">M</span>
                        <span class="text-xs font-extrabold text-sub2 uppercase">T</span>
                        <span class="text-xs font-extrabold text-sub2 uppercase">W</span>
                        <span class="text-xs font-extrabold text-sub2 uppercase">T</span>
                        <span class="text-xs font-extrabold text-sub2 uppercase">F</span>
                        <span class="text-xs font-extrabold text-sub2 uppercase">S</span>
                    </div>
                    <!-- Days Matrix Grid -->
                    <div id="calendarDaysGrid" class="grid grid-cols-7 gap-1.5">
                        <!-- Dynamic days load here -->
                    </div>
                </div>
            </div>

            <!-- RIGHT: Selected Date Details Section -->
            <div class="cal-side glass p-4 rounded-3xl mb-6">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-900/10 gap-2">
                    <h3 id="selectedDateHeader" class="text-xs font-bold text-acc uppercase tracking-wider">Select a date to view details</h3>
                    <span id="selectedDateBadge" class="pill-count text-[10px] px-2 py-0.5 rounded font-semibold whitespace-nowrap">No selection</span>
                </div>
                <div id="selectedDateContent" class="space-y-3">
                    <p class="text-xs text-sub2 text-center py-4">Click any date in the calendar above to inspect holidays or follow-ups.</p>
                </div>
            </div>

        </div>

    </div>

    <!-- Bottom Navigation Bar with Labels -->
    <nav class="glass nav-glass nav-wrap fixed bottom-3 left-4 right-4 mx-auto px-2 py-2 flex justify-around items-center z-40">
        <a href="index.html" class="nav-item text-sub hover:text-blue-800 flex flex-col items-center space-y-1">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="leads.html" class="nav-item text-sub hover:text-blue-800 flex flex-col items-center space-y-1">
            <i class="fa-solid fa-user-group text-base"></i>
            <span class="text-[10px] font-medium">Leads</span>
        </a>
        <a href="summary.html" class="nav-item text-sub hover:text-blue-800 flex flex-col items-center space-y-1 relative">
            <i class="fa-solid fa-list-check text-base"></i>
            <span class="absolute -top-1 -right-1 bg-rose-500/90 text-on text-[9px] font-bold px-1 rounded-full shadow" id="badgeCount">0</span>
            <span class="text-[10px] font-medium">Summary</span>
        </a>
        <a href="calendar.html" class="nav-item active text-acc flex flex-col items-center space-y-1">
            <i class="fa-solid fa-calendar text-base"></i>
            <span class="text-[10px] font-medium">Calendar</span>
        </a>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxot3Icntv6plIlm1q-V62facX6LT6EuTXKBiVvrXXfN_gi33wZZMByeMQuV8FMfyVqvQ/exec";
        let leads = [];
        let currentDate = new Date();
        let selectedDateKey = '';

        // Maharashtra Bank Holidays List
        const mhHolidays = {
            "2026-01-26": "Republic Day",
            "2026-02-19": "Shivaji Maharaj Jayanti",
            "2026-03-21": "Id-ul-Fitr",
            "2026-03-26": "Ram Navami",
            "2026-03-31": "Mahavir Jayanti",
            "2026-04-03": "Good Friday",
            "2026-04-14": "Ambedkar Jayanti",
            "2026-05-01": "Maharashtra Day",
            "2026-05-28": "Bakri Eid",
            "2026-06-27": "Muharram",
            "2026-08-15": "Independence Day",
            "2026-08-27": "Milad-un-Nabi",
            "2026-09-04": "Ganesh Chaturthi",
            "2026-10-02": "Gandhi Jayanti",
            "2026-10-20": "Dussehra",
            "2026-11-09": "Diwali",
            "2026-11-24": "Guru Nanak Jayanti",
            "2026-12-25": "Christmas"
        };

        window.onload = function() {
            let today = new Date();
            selectedDateKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            fetchLeadsFromSheet();
        };

        async function fetchLeadsFromSheet() {
            try {
                let response = await fetch(WEB_APP_URL);
                let data = await response.json();
                
                leads = data.map((item, index) => ({
                    id: item.id || (index + 1),
                    sNo: item["Sr No"] || item.sNo || (index + 1),
                    ctDate: item["CT Date"] || item.ctDate || "",
                    unit: item["Unit"] || item.unit || "Mumbai-2",
                    customerType: item["Customer Type"] || item.customerType || "Prime",
                    custId: item["Cust ID (If UH Allows)"] !== undefined ? String(item["Cust ID (If UH Allows)"]) : (item.custId ? String(item.custId) : ""),
                    customerName: item["Customer Name"] || item.customerName || "",
                    callMeetingType: item["Call/Meeting Type"] || item.callMeetingType || "Dialer/Call",
                    expectedPremium: item["Expected Premium"] || item.expectedPremium || "",
                    planPitched: item["Plan Pitched"] || item.planPitched || "",
                    status: item["CT/Lead Status"] || item.status || "New Lead",
                    followupDate: item["Followup Date"] || item.followupDate || "",
                    fls: item["FLS - Insurer"] || item.fls || "Mahfuz",
                    remark: item["FLS Detailed Lead Remark & Date"] || item.remark || "",
                    rmName: item["RM Name"] || item.rmName || "",
                    vrbh: item["VRBH"] || item.vrbh || "Rahul",
                    uhName: item["UH Name"] || item.uhName || "Amit Chodankar"
                }));

                renderCalendar();
                updateBadge();
                showDateDetails(selectedDateKey);
            } catch (error) {
                console.error("Error loading calendar leads:", error);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarDaysGrid');
            grid.innerHTML = '';

            let year = currentDate.getFullYear();
            let month = currentDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendarMonthTitle').innerText = `${monthNames[month]} ${year}`;

            let firstDayIndex = new Date(year, month, 1).getDay();
            let totalDays = new Date(year, month + 1, 0).getDate();

            let followupMap = {};
            leads.forEach(l => {
                if (l.followupDate) {
                    let fDateClean = l.followupDate.split('T')[0];
                    if (!followupMap[fDateClean]) {
                        followupMap[fDateClean] = [];
                    }
                    followupMap[fDateClean].push(l);
                }
            });

            // Blank spaces for offset
            for (let i = 0; i < firstDayIndex; i++) {
                let emptyCell = document.createElement('div');
                emptyCell.className = "cal-cell cal-empty rounded-xl";
                grid.appendChild(emptyCell);
            }

            // Render days
            for (let day = 1; day <= totalDays; day++) {
                let dayStr = String(day).padStart(2, '0');
                let monthStr = String(month + 1).padStart(2, '0');
                let dateKey = `${year}-${monthStr}-${dayStr}`;

                let cellDate = new Date(year, month, day);
                let dayOfWeek = cellDate.getDay();

                let isSecondOrFourthSat = false;
                if (dayOfWeek === 6) {
                    let satCount = Math.floor((day - 1) / 7) + 1;
                    if (satCount === 2 || satCount === 4) {
                        isSecondOrFourthSat = true;
                    }
                }

                let isSunday = (dayOfWeek === 0);
                let holidayReason = mhHolidays[dateKey];
                let isHoliday = isSunday || isSecondOrFourthSat || holidayReason;

                let dayFollowups = followupMap[dateKey] || [];
                let hasFollowup = dayFollowups.length > 0;

                let cell = document.createElement('div');
                
                let bgClass = "cal-day";
                let textStyle = "font-semibold text-ink";

                if (isHoliday) {
                    textStyle = "text-ros font-extrabold text-sm";
                }

                if (hasFollowup) {
                    textStyle = "text-emr font-extrabold text-sm underline decoration-emerald-600 underline-offset-4";
                }

                if (dateKey === selectedDateKey) {
                    bgClass += " cal-selected";
                }

                cell.className = `cal-cell rounded-xl flex flex-col items-center justify-center cursor-pointer relative ${bgClass}`;
                cell.onclick = () => {
                    selectedDateKey = dateKey;
                    renderCalendar();
                    showDateDetails(dateKey);
                };

                cell.innerHTML = `
                    <span class="${textStyle}">${day}</span>
                    <div class="flex space-x-1 mt-0.5">
                        ${isHoliday ? '<span class="w-1.5 h-1.5 bg-rose-600 rounded-full"></span>' : ''}
                        ${hasFollowup ? '<span class="w-1.5 h-1.5 bg-emerald-600 rounded-full"></span>' : ''}
                    </div>
                `;

                grid.appendChild(cell);
            }
        }

        function showDateDetails(dateKey) {
            const header = document.getElementById('selectedDateHeader');
            const badge = document.getElementById('selectedDateBadge');
            const content = document.getElementById('selectedDateContent');

            header.innerText = `Details for ${dateKey}`;
            content.innerHTML = '';

            let holidayReason = mhHolidays[dateKey];
            let cellDate = new Date(dateKey);
            let dayOfWeek = cellDate.getDay();
            if (!holidayReason) {
                if (dayOfWeek === 0) holidayReason = "Sunday Weekly Off";
                else if (dayOfWeek === 6) {
                    let dayNum = parseInt(dateKey.split('-')[2]);
                    let satCount = Math.floor((dayNum - 1) / 7) + 1;
                    if (satCount === 2) holidayReason = "2nd Saturday Bank Holiday";
                    if (satCount === 4) holidayReason = "4th Saturday Bank Holiday";
                }
            }

            let dayFollowups = leads.filter(l => l.followupDate && l.followupDate.split('T')[0] === dateKey);

            let totalItemsCount = (holidayReason ? 1 : 0) + dayFollowups.length;
            badge.innerText = `${totalItemsCount} Event(s)`;

            if (holidayReason) {
                let holCard = document.createElement('div');
                holCard.className = "holiday-card p-3 rounded-2xl text-xs flex items-center space-x-3";
                holCard.innerHTML = `
                    <div class="holiday-icon w-8 h-8 rounded-full flex items-center justify-center font-bold">
                        <i class="fa-solid fa-calendar-xmark"></i>
                    </div>
                    <div>
                        <span class="block text-[10px] text-ros uppercase font-bold">Holiday / Event</span>
                        <h4 class="font-extrabold text-ink text-sm">${holidayReason}</h4>
                    </div>
                `;
                content.appendChild(holCard);
            }

            if (dayFollowups.length > 0) {
                let fTitle = document.createElement('p');
                fTitle.className = "text-[11px] font-bold text-sub2 uppercase tracking-wider pt-1";
                fTitle.innerText = `Follow-up Leads (${dayFollowups.length})`;
                content.appendChild(fTitle);

                dayFollowups.forEach(lead => {
                    let badgeColor = 'badge-follow';
                    let currentStatus = (lead.status || '').toLowerCase();
                    if(currentStatus.includes('close')) badgeColor = 'badge-closed';
                    else if(currentStatus.includes('new')) badgeColor = 'badge-new';

                    let phoneNum = lead.custId ? String(lead.custId).trim() : '';

                    let card = document.createElement('div');
                    card.className = "glass-card p-3 rounded-2xl flex flex-col space-y-2 text-xs";
                    card.innerHTML = `
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <h4 class="font-extrabold text-base text-ink tracking-tight">${lead.customerName || 'N/A'}</h4>
                                <p class="text-sub mt-0.5"><i class="fa-solid fa-id-badge text-[10px] mr-1 text-emr"></i><span class="text-ink font-semibold">${phoneNum || 'No Number'}</span> | <i class="fa-solid fa-location-dot ml-1"></i> ${lead.unit || 'Mumbai-2'}</p>
                            </div>
                            <span class="badge text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}">${lead.status || 'N/A'}</span>
                        </div>
                        <div class="glass-inset grid grid-cols-2 gap-1 p-2 rounded-xl text-[11px] text-sub">
                            <div><b>FLS:</b> <span class="text-acc font-semibold">${lead.fls || 'N/A'}</span></div>
                            <div><b>Exp. Premium:</b> ₹${lead.expectedPremium || '0'}</div>
                            <div><b>RM:</b> ${lead.rmName || '-'}</div>
                            <div><b>VRBH:</b> <span class="text-amb font-semibold">${lead.vrbh || '-'}</span></div>
                            <div class="col-span-2 text-acc"><b>Plan:</b> ${lead.planPitched || 'N/A'}</div>
                        </div>
                        <div class="flex justify-between items-center pt-1">
                            <div class="flex space-x-2">
                                ${phoneNum !== '' ? `
                                <a href="tel:${phoneNum}" class="btn-glass btn-emerald px-2.5 py-1 rounded-xl font-semibold flex items-center space-x-1">
                                    <i class="fa-solid fa-phone text-[10px]"></i> <span>Call</span>
                                </a>
                                <a href="https://wa.me/91${phoneNum}?text=Hello%20${encodeURIComponent(lead.customerName || '')},%20regarding%20your%20follow-up..." target="_blank" class="btn-glass btn-green px-2.5 py-1 rounded-xl font-semibold flex items-center space-x-1">
                                    <i class="fa-brands fa-whatsapp"></i> <span>Msg</span>
                                </a>` : `<span class="text-[10px] text-sub2 italic">No phone available</span>`}
                            </div>
                        </div>
                    `;
                    content.appendChild(card);
                });
            }

            if (!holidayReason && dayFollowups.length === 0) {
                content.innerHTML += `<p class="text-xs text-sub2 text-center py-4">No follow-ups or holidays on this date.</p>`;
            }
        }

        function updateBadge() {
            const followupCount = leads.filter(l => (l.status || '').toLowerCase().includes('follow')).length;
            document.getElementById('badgeCount').innerText = followupCount;
        }
    </script>
</body>
</html>
