<body class="bg-[#0b192c] text-white min-h-screen pb-28">

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxot3Icntv6plIlm1q-V62facX6LT6EuTXKBiVvrXXfN_gi33wZZMByeMQuV8FMfyVqvQ/exec";
        let leads = [];

        window.onload = function() {
            fetchLeadsFromSheet();
        };

        function formatIndianCurrency(numStr) {
            if (!numStr) return '';
            let cleanNum = numStr.toString().replace(/[^0-9]/g, '');
            if (cleanNum === '') return '';
            let x = cleanNum;
            let lastThree = x.substring(x.length - 3);
            let otherNumbers = x.substring(0, x.length - 3);
            if (otherNumbers != '') {
                lastThree = ',' + lastThree;
            }
            return otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
        }

        function formatInputCurrency(input) {
            if (input.value) {
                input.value = formatIndianCurrency(input.value);
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                let d = new Date(dateString);
                if (isNaN(d.getTime())) return dateString;
                let day = String(d.getDate()).padStart(2, '0');
                let month = String(d.getMonth() + 1).padStart(2, '0');
                let year = d.getFullYear();
                return `${day}-${month}-${year}`;
            } catch (e) {
                return dateString;
            }
        }

        async function fetchLeadsFromSheet() {
            try {
                let response = await fetch(WEB_APP_URL);
                let data = await response.json();
                
                leads = data.map((item, index) => ({
                    id: item.id || (index + 1),
                    sNo: item["Sr No"] || item.sNo || (index + 1),
                    ctDate: item["CT Date"] || item.ctDate || "",
                    unit: item["Unit"] || item.unit || "Mumbai-2",
                    customerType: item["Customer Type"] || item.customerType || "Prime",
                    custId: item["Cust ID (If UH Allows)"] || item.custId || "",
                    customerName: item["Customer Name"] || item.customerName || "",
                    callMeetingType: item["Call/Meeting Type"] || item.callMeetingType || "Dialer/Call",
                    profiledRm: item["Profiled & CT Trasnfer by RM Y/N"] || item.profiledRm || "Y",
                    illustration: item["Illustration sent"] || item.illustration || "Y",
                    f2f: item["F2F Done"] || item.f2f || "Y",
                    crmYn: item["CRM Y/N"] || item.crmYn || "Y",
                    crmReason: item["CRM If N - Reason"] || item.crmReason || "",
                    incomeSlab: item["Income Slab"] || item.incomeSlab || "",
                    acBal: item["Customer A/C Bal / CC LIM / FD"] || item.acBal || "",
                    premPitched: item["Premium Pitched"] || item.premPitched || "",
                    expectedPremium: item["Expected Premium"] || item.expectedPremium || "",
                    planPitched: item["Plan Pitched"] || item.planPitched || "",
                    status: item["CT/Lead Status"] || item.status || "New Lead",
                    vrbhInformed: item["IF NI/NC Lead Is VRBH/UH Informed"] || item.vrbhInformed || "Y",
                    followupDate: item["Followup Date"] || item.followupDate || "",
                    fls: item["FLS - Insurer"] || item.fls || "Mahfuz",
                    csmInsurer: item["CSM- Insurer"] || item.csmInsurer || "ABSLI",
                    remark: item["FLS Detailed Lead Remark & Date"] || item.remark || "",
                    l1Spoken: item["L1 Insurer CSM/TM Spoken to Customer (CSM)"] || item.l1Spoken || "",
                    l1Remarks: item["LI 1 Insurer CSM/ TM Lead Remaks"] || item["LI 1 Insurer CSM/ TM Lead Remarks"] || item.l1Remarks || "",
                    rmName: item["RM Name"] || item.rmName || "",
                    vrbh: item["VRBH"] || item.vrbh || "Rahul",
                    uhName: item["UH Name"] || item.uhName || "Amit Chodankar"
                }));

                renderRecentLeads();
                updateStats();
            } catch (error) {
                console.error("Error fetching from sheet:", error);
                document.getElementById('leadsListContainer').innerHTML = `<p class="text-xs text-rose-400 text-center py-4">Failed to load leads from sheet.</p>`;
            }
        }

        function goToLeads(status) {
            window.location.href = `leads.html?status=${encodeURIComponent(status)}`;
        }

        function openAddModal() {
            document.getElementById('leadForm').reset();
            document.getElementById('editLeadId').value = '';
            document.getElementById('fSrNo').value = leads.length + 1;
            
            // Auto-fill current date in CT Date field (Changeable)
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('fCtDate').value = `${year}-${month}-${day}`;

            document.getElementById('fUnit').value = 'Mumbai-2';
            document.getElementById('fCustomerType').value = 'Prime';
            document.getElementById('fCallMeetingType').value = 'Dialer/Call';
            document.getElementById('fCsmInsurer').value = 'ABSLI';
            document.getElementById('fUH').value = 'Amit Chodankar';
            document.getElementById('fStatus').value = 'New Lead';
            document.getElementById('fVrbhInformed').value = 'Y';
            document.getElementById('formModalTitle').innerText = 'Add New Lead (28 Fields)';
            toggleFormModal();
        }

        function editLead(id) {
            let lead = leads.find(l => l.id == id || l.sNo == id);
            if (!lead) return;

            document.getElementById('editLeadId').value = lead.id;
            document.getElementById('fSrNo').value = lead.sNo || '';
            document.getElementById('fCtDate').value = lead.ctDate ? lead.ctDate.split('T')[0] : '';
            document.getElementById('fUnit').value = lead.unit || 'Mumbai-2';
            document.getElementById('fCustomerType').value = 'Prime';
            document.getElementById('fCustId').value = lead.custId || '';
            document.getElementById('fCustomerName').value = lead.customerName || '';
            document.getElementById('fCallMeetingType').value = 'Dialer/Call';
            document.getElementById('fProfiledRM').value = lead.profiledRm || 'Y';
            document.getElementById('fIllustration').value = lead.illustration || 'Y';
            document.getElementById('fF2F').value = lead.f2f || 'Y';
            document.getElementById('fCrmYN').value = lead.crmYn || 'Y';
            document.getElementById('fCrmReason').value = lead.crmReason || '';
            document.getElementById('fIncomeSlab').value = lead.incomeSlab || '';
            document.getElementById('fAcBal').value = lead.acBal || '';
            document.getElementById('fPremPitched').value = lead.premPitched || '';
            document.getElementById('fExpPremium').value = lead.expectedPremium || '';
            document.getElementById('fPlanPitched').value = lead.planPitched || '';
            document.getElementById('fStatus').value = lead.status || 'New Lead';
            document.getElementById('fVrbhInformed').value = lead.vrbhInformed || 'Y';
            document.getElementById('fFollowupDate').value = lead.followupDate ? lead.followupDate.split('T')[0] : '';
            document.getElementById('fFLS').value = lead.fls || 'Mahfuz';
            document.getElementById('fCsmInsurer').value = 'ABSLI';
            document.getElementById('fRemark').value = lead.remark || '';
            document.getElementById('fL1Spoken').value = lead.l1Spoken || '';
            document.getElementById('fL1Remarks').value = lead.l1Remarks || '';
            document.getElementById('fRM').value = lead.rmName || '';
            document.getElementById('fVRBH').value = lead.vrbh || 'Rahul';
            document.getElementById('fUH').value = 'Amit Chodankar';

            document.getElementById('formModalTitle').innerText = 'Edit Lead Details';
            toggleFormModal();
        }

        async function deleteLead(id) {
            if(!confirm("Kya aap sach me is lead ko delete karna chahte hain?")) return;

            document.getElementById('leadsListContainer').innerHTML = `<p class="text-xs text-rose-400 text-center py-4">Deleting entry from sheet...</p>`;
            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "delete", id: id })
                });
                fetchLeadsFromSheet();
            } catch (error) {
                console.error("Error deleting lead:", error);
                alert("Failed to delete entry!");
            }
        }

        function toggleFormModal() {
            document.getElementById('formModal').classList.toggle('hidden');
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const editId = document.getElementById('editLeadId').value;
            
            const leadData = {
                id: editId ? editId : Date.now(),
                sNo: document.getElementById('fSrNo').value || (leads.length + 1),
                ctDate: document.getElementById('fCtDate').value,
                unit: document.getElementById('fUnit').value,
                customerType: "Prime",
                custId: document.getElementById('fCustId').value,
                customerName: document.getElementById('fCustomerName').value,
                callMeetingType: "Dialer/Call",
                profiledRm: document.getElementById('fProfiledRM').value,
                illustration: document.getElementById('fIllustration').value,
                f2f: document.getElementById('fF2F').value,
                crmYn: document.getElementById('fCrmYN').value,
                crmReason: document.getElementById('fCrmReason').value,
                incomeSlab: document.getElementById('fIncomeSlab').value,
                acBal: document.getElementById('fAcBal').value,
                premPitched: formatIndianCurrency(document.getElementById('fPremPitched').value),
                expectedPremium: formatIndianCurrency(document.getElementById('fExpPremium').value),
                planPitched: document.getElementById('fPlanPitched').value,
                status: document.getElementById('fStatus').value,
                vrbhInformed: document.getElementById('fVrbhInformed').value,
                followupDate: document.getElementById('fFollowupDate').value,
                fls: document.getElementById('fFLS').value,
                csmInsurer: "ABSLI",
                remark: document.getElementById('fRemark').value,
                l1Spoken: document.getElementById('fL1Spoken').value,
                l1Remarks: document.getElementById('fL1Remarks').value,
                rmName: document.getElementById('fRM').value,
                vrbh: document.getElementById('fVRBH').value,
                uhName: "Amit Chodankar"
            };

            toggleFormModal();
            document.getElementById('leadsListContainer').innerHTML = `<p class="text-xs text-cyan-400 text-center py-4">Saving entry to Google Sheet...</p>`;

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "save", lead: leadData })
                });
                fetchLeadsFromSheet();
            } catch (error) {
                console.error("Error saving lead:", error);
                alert("Error saving data!");
            }
        }

        function renderRecentLeads() {
            const container = document.getElementById('leadsListContainer');
            container.innerHTML = '';
            let limitedLeads = leads.slice(0, 5);

            if (limitedLeads.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No leads found in sheet.</p>`;
                return;
            }

            limitedLeads.forEach(lead => {
                let badgeColor = 'bg-slate-800 text-slate-300 border border-slate-700';
                let currentStatus = (lead.status || '').toLowerCase();

                if(currentStatus.includes('new')) badgeColor = 'bg-indigo-950 text-indigo-300 border border-indigo-800';
                else if(currentStatus.includes('follow')) badgeColor = 'bg-amber-950 text-amber-300 border border-amber-800';
                else if(currentStatus.includes('no contact')) badgeColor = 'bg-purple-950 text-purple-300 border border-purple-800';
                else if(currentStatus.includes('close')) badgeColor = 'bg-sky-950 text-sky-300 border border-sky-800';
                else if(currentStatus.includes('not') || currentStatus.includes('reject')) badgeColor = 'bg-rose-950 text-rose-300 border border-rose-800';

                let formattedExpPrem = lead.expectedPremium ? formatIndianCurrency(lead.expectedPremium) : '0';

                const card = document.createElement('div');
                card.className = "bg-[#182c4d] p-3.5 rounded-xl border border-slate-700 flex flex-col space-y-2.5 text-xs shadow-md";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-sm text-white">${lead.customerName || 'N/A'}</h4>
                            <p class="text-slate-400 mt-0.5"><i class="fa-solid fa-id-badge text-[10px] mr-1 text-emerald-400"></i><span class="text-white font-medium">${lead.custId || 'N/A'}</span> | <i class="fa-solid fa-location-dot ml-1"></i> ${lead.unit || 'Mumbai-2'}</p>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}">${lead.status || 'N/A'}</span>
                            <button onclick="editLead('${lead.id}')" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 p-1.5 rounded-lg transition border border-slate-700">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button onclick="deleteLead('${lead.id}')" class="bg-rose-950/80 hover:bg-rose-900 text-rose-400 p-1.5 rounded-lg transition border border-rose-800">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5 bg-slate-900/60 p-2.5 rounded text-[11px] text-slate-300">
                        <div><b>CT Date:</b> <span class="text-emerald-400 font-semibold">${formatDate(lead.ctDate)}</span></div>
                        <div><b>VRBH:</b> <span class="text-amber-400 font-semibold">${lead.vrbh || '-'}</span></div>
                        <div><b>FLS:</b> <span class="text-cyan-400 font-semibold">${lead.fls || 'N/A'}</span></div>
                        <div><b>Exp. Premium:</b> ₹${formattedExpPrem}</div>
                        <div class="col-span-2 text-cyan-300"><b>Plan:</b> ${lead.planPitched || 'N/A'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateStats() {
            const total = leads.length;
            
            const newLeadCount = leads.filter(l => (l.status || '').toLowerCase().includes('new')).length;
            const followupCount = leads.filter(l => (l.status || '').toLowerCase().includes('follow')).length;
            const noContactCount = leads.filter(l => (l.status || '').toLowerCase().includes('no contact')).length;
            const closedCount = leads.filter(l => (l.status || '').toLowerCase().includes('close')).length;
            const notInterestedCount = leads.filter(l => (l.status || '').toLowerCase().includes('not')).length;

            document.getElementById('countNewLead').innerText = newLeadCount;
            document.getElementById('countFollowup').innerText = followupCount;
            document.getElementById('countNoContact').innerText = noContactCount;
            document.getElementById('countClosed').innerText = closedCount;
            document.getElementById('countNotInterested').innerText = notInterestedCount;
            document.getElementById('badgeCount').innerText = followupCount;

            const conversionRate = total > 0 ? Math.round((closedCount / total) * 100) : 0;
            document.getElementById('conversionPercentText').innerText = conversionRate + '%';
            document.getElementById('gaugePath').setAttribute('stroke-dasharray', `${conversionRate}, 100`);
        }

        function exportToCSV() {
            if (leads.length === 0) { alert('No data to export.'); return; }
            let csv = "Sr No,CT Date,Unit,Customer Type,Cust ID (If UH Allows),Customer Name,Call/Meeting Type,Profiled & CT Trasnfer by RM Y/N,Illustration sent,F2F Done,CRM Y/N,CRM If N - Reason,Income Slab,Customer A/C Bal / CC LIM / FD,Premium Pitched,Expected Premium,Plan Pitched,CT/Lead Status,IF NI/NC Lead Is VRBH/UH Informed,Followup Date,FLS - Insurer,CSM- Insurer,FLS Detailed Lead Remark & Date,L1 Insurer CSM/TM Spoken to Customer (CSM),LI 1 Insurer CSM/ TM Lead Remaks,RM Name,VRBH,UH Name\n";
            leads.forEach(l => {
                csv += `"${l.sNo || ''}","${l.ctDate || ''}","${l.unit || 'Mumbai-2'}","${l.customerType || 'Prime'}","${l.custId || ''}","${l.customerName || ''}","${l.callMeetingType || 'Dialer/Call'}","${l.profiledRm || ''}","${l.illustration || ''}","${l.f2f || ''}","${l.crmYn || ''}","${l.crmReason || ''}","${l.incomeSlab || ''}","${l.acBal || ''}","${l.premPitched || ''}","${l.expectedPremium || ''}","${l.planPitched || ''}","${l.status || ''}","${l.vrbhInformed || ''}","${l.followupDate || ''}","${l.fls || ''}","${l.csmInsurer || 'ABSLI'}","${l.remark || ''}","${l.l1Spoken || ''}","${l.l1Remarks || ''}","${l.rmName || ''}","${l.vrbh || ''}","${l.uhName || 'Amit Chodankar'}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "sheet_leads_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
