<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPulse - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        html { color-scheme: light; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #e6eeff;
            color: #07102b;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== text colors (high contrast on frost glass) ===== */
        .text-ink  { color: #07102b; }
        .text-sub  { color: #334155; }
        .text-sub2 { color: #475569; }
        .text-acc  { color: #1d4ed8; }
        .text-acc2 { color: #4338ca; }
        .text-amb  { color: #92400e; }
        .text-emr  { color: #047857; }
        .text-ros  { color: #be123c; }
        .text-on   { color: #ffffff; }

        /* ================= LIQUID BACKDROP ================= */
        .lg-backdrop {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(160deg, #eaf1ff 0%, #e2ebfc 50%, #f1e9fb 100%);
        }
        .lg-orb { position: absolute; border-radius: 9999px; filter: blur(70px); will-change: transform; }
        .lg-orb.o1 { width: max(300px, 30vmax); height: max(300px, 30vmax); top: -8%; left: -6%;
            background: #4f8dff; opacity: .55; animation: drift1 24s ease-in-out infinite alternate; }
        .lg-orb.o2 { width: max(320px, 32vmax); height: max(320px, 32vmax); bottom: -12%; right: -8%;
            background: #ff8fc2; opacity: .5; animation: drift2 28s ease-in-out infinite alternate; }
        .lg-orb.o3 { width: max(220px, 22vmax); height: max(220px, 22vmax); top: 42%; left: 48%;
            background: #ffd166; opacity: .45; animation: drift3 26s ease-in-out infinite alternate; }
        .lg-orb.o4 { width: max(240px, 24vmax); height: max(240px, 24vmax); top: 55%; left: -6%;
            background: #7dd3fc; opacity: .4; animation: drift2 30s ease-in-out infinite alternate-reverse; }
        @keyframes drift1 { to { transform: translate(8vw, 10vh) scale(1.12); } }
        @keyframes drift2 { to { transform: translate(-8vw, -9vh) scale(1.1); } }
        @keyframes drift3 { to { transform: translate(-10vw, 8vh) scale(1.15); } }
        @media (prefers-reduced-motion: reduce) { .lg-orb { animation: none !important; } }

        /* ================= GLASS SURFACES ================= */
        .glass {
            background: rgba(255, 255, 255, 0.62);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.18), inset 0 1px 0 #ffffff, inset 0 -1px 0 rgba(255,255,255,0.5);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.84);
            -webkit-backdrop-filter: blur(34px) saturate(190%);
            backdrop-filter: blur(34px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 24px 70px rgba(30, 58, 138, 0.3), inset 0 1px 0 #ffffff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.68);
            -webkit-backdrop-filter: blur(16px) saturate(170%);
            backdrop-filter: blur(16px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 24px rgba(30, 58, 138, 0.14), inset 0 1px 0 #ffffff;
            transition: box-shadow .2s ease;
        }
        .glass-card:hover { box-shadow: 0 12px 30px rgba(30, 58, 138, 0.22), inset 0 1px 0 #ffffff; }
        .glass-inset {
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(15, 23, 42, 0.1);
            box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.06);
        }

        /* ================= HOME: GAUGE + STATUS CARDS ================= */
        .gauge-track { color: #cbd5e1; }
        .gauge-fill  { color: #1d4ed8; }

        .stat-card {
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 10px 26px rgba(30, 58, 138, 0.28), inset 0 1px 0 rgba(255,255,255,0.45);
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
            transition: transform .15s ease, filter .2s ease;
        }
        .stat-card:hover { filter: brightness(1.06); }
        .stat-card:active { transform: scale(0.97); }
        .stat-new  { background: linear-gradient(135deg, #4f46e5, #3730a3); }
        .stat-fup  { background: linear-gradient(135deg, #d97706, #92400e); }
        .stat-nc   { background: linear-gradient(135deg, #9333ea, #6b21a8); }
        .stat-clo  { background: linear-gradient(135deg, #0284c7, #075985); }
        .stat-ni   { background: linear-gradient(135deg, #e11d48, #9f1239); }
        .stat-icon { background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.4); }

        /* ================= INPUTS ================= */
        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(15, 23, 42, 0.2);
            border-radius: 12px;
            color: #07102b;
            box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.08);
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }
        .glass-input::placeholder { color: #64748b; }
        .glass-input:focus {
            outline: none;
            background: #ffffff;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.2);
        }
        .glass-input[readonly] {
            background: rgba(245, 158, 11, 0.14);
            border-color: rgba(180, 83, 9, 0.35);
            color: #7c2d12;
        }
        select.glass-input option { background: #ffffff; color: #07102b; }

        /* ================= BUTTONS ================= */
        .btn-glass {
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 6px 16px rgba(30, 58, 138, 0.28), inset 0 1px 0 rgba(255,255,255,0.55);
            text-shadow: 0 1px 1px rgba(0,0,0,0.2);
            transition: transform .15s ease, filter .2s ease;
        }
        .btn-glass:hover { filter: brightness(1.08); }
        .btn-glass:active { transform: scale(0.96); }
        .btn-emerald { background: linear-gradient(180deg, #10b981, #047857); }
        .btn-cyan    { background: linear-gradient(180deg, #3b82f6, #1d4ed8); }
        .btn-neutral { background: rgba(255,255,255,0.85); color: #0f172a; text-shadow: none; border-color: rgba(15,23,42,0.15); box-shadow: 0 4px 12px rgba(30,58,138,0.12), inset 0 1px 0 #fff; }
        .btn-fab { background: linear-gradient(180deg, #10b981, #0f766e); box-shadow: 0 12px 28px rgba(5,150,105,0.4), inset 0 1px 0 rgba(255,255,255,0.55); }
        .btn-link-wide { background: rgba(255,255,255,0.85); color: #1d4ed8; border: 1px solid rgba(29,78,216,0.35); box-shadow: inset 0 1px 0 #fff; transition: background .2s ease; }
        .btn-link-wide:hover { background: #ffffff; }

        .icon-btn {
            width: 32px; height: 32px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 10px;
            color: #475569;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(15,23,42,0.12);
            box-shadow: inset 0 1px 0 #fff;
            transition: all .2s ease;
        }
        .icon-btn.edit:hover { color: #1d4ed8; background: #eff6ff; border-color: rgba(29,78,216,0.4); }
        .icon-btn.del:hover  { color: #be123c; background: #fff1f2; border-color: rgba(190,18,60,0.4); }

        /* ================= STATUS BADGES ================= */
        .badge { box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); border: 1px solid transparent; }
        .badge-default { background: rgba(100,116,139,0.18); color: #1e293b; border-color: rgba(100,116,139,0.45); }
        .badge-new     { background: rgba(99,102,241,0.16); color: #3730a3; border-color: rgba(99,102,241,0.5); }
        .badge-follow  { background: rgba(245,158,11,0.24); color: #78350f; border-color: rgba(180,83,9,0.55); }
        .badge-nc      { background: rgba(168,85,247,0.16); color: #581c87; border-color: rgba(147,51,234,0.5); }
        .badge-closed  { background: rgba(14,165,233,0.17); color: #0c4a6e; border-color: rgba(2,132,199,0.5); }
        .badge-ni      { background: rgba(244,63,94,0.15); color: #881337; border-color: rgba(225,29,72,0.5); }

        /* ================= NAV ================= */
        .nav-glass { border-radius: 26px; }
        .nav-item { padding: 6px 14px; border-radius: 18px; transition: background .2s ease, color .2s ease; }
        .nav-item.active {
            background: rgba(29, 78, 216, 0.12);
            border: 1px solid rgba(29, 78, 216, 0.35);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        /* ================= RESPONSIVE LAYOUT ================= */
        .page-wrap { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
        .nav-wrap { max-width: 28rem; }
        .home-top { display: block; }
        @media (min-width: 768px) {
            .page-wrap { max-width: none; }
            .nav-wrap { max-width: 34rem; }
            #statusGrid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 14px;
            }
            #statusGrid > * { margin: 0 !important; }
            #leadsListContainer {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
                gap: 16px;
            }
            #leadsListContainer > * { margin: 0 !important; }
            #leadsListContainer > p { grid-column: 1 / -1; }
        }
        @media (min-width: 1024px) {
            html { font-size: 17px; }
            .home-top { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: stretch; }
            #statusGrid { align-content: start; }
        }

        /* ================= MISC ================= */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(15,23,42,0.25); border-radius: 9999px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::selection { background: rgba(29,78,216,0.25); }
    </style>
</head>
<body class="text-ink min-h-screen pb-32">

    <!-- LIQUID BACKDROP -->
    <div class="lg-backdrop" aria-hidden="true">
        <div class="lg-orb o1"></div>
        <div class="lg-orb o2"></div>
        <div class="lg-orb o3"></div>
        <div class="lg-orb o4"></div>
    </div>

    <!-- FLOATING TOP HEADER BAR -->
    <div class="sticky top-3 z-40 px-4 md:px-8 mb-3">
        <div class="page-wrap glass rounded-2xl px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button class="text-lg text-sub hover:text-blue-800"><i class="fa-solid fa-bars"></i></button>
                <div class="flex items-center space-x-2 bg-white/80 px-3.5 py-1.5 rounded-full border border-slate-900/10">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span class="text-[11px] font-extrabold text-acc tracking-wide">LMC By Mahfuz</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="exportToCSV()" class="btn-glass btn-emerald text-xs font-bold px-3 py-1.5 rounded-xl flex items-center space-x-1">
                    <i class="fa-solid fa-download text-[10px]"></i> <span>Export</span>
                </button>
            </div>
        </div>
    </div>

    <div class="page-wrap p-4 md:px-8 pt-1">

        <div class="home-top">
            <!-- Circular Performance Gauge -->
            <div class="glass rounded-3xl p-5 mb-6 text-center relative mt-2 flex flex-col items-center justify-center">
                <div class="relative w-36 h-36 mx-auto flex items-center justify-center">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <path class="gauge-track" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path id="gaugePath" class="gauge-fill transition-all duration-1000" stroke-dasharray="0, 100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="conversionPercentText" class="text-3xl font-extrabold text-ink">0%</span>
                    </div>
                </div>
                <p class="text-xs font-semibold text-sub2 mt-2">Conversion Performance</p>
            </div>

            <!-- 5 Interactive Status Cards -->
            <div id="statusGrid" class="space-y-3 mb-6 md:mt-2">
                <div onclick="goToLeads('New Lead')" class="stat-card stat-new p-4 rounded-2xl cursor-pointer flex justify-between items-center">
                    <div>
                        <h3 class="text-sm font-bold tracking-wide">New Lead</h3>
                        <p id="countNewLead" class="text-3xl font-black mt-1">0</p>
                    </div>
                    <div class="stat-icon w-14 h-14 rounded-full flex items-center justify-center text-xl"><i class="fa-solid fa-user-plus"></i></div>
                </div>

                <div onclick="goToLeads('Follow up')" class="stat-card stat-fup p-4 rounded-2xl cursor-pointer flex justify-between items-center">
                    <div>
                        <h3 class="text-sm font-bold tracking-wide">Follow up</h3>
                        <p id="countFollowup" class="text-3xl font-black mt-1">0</p>
                    </div>
                    <div class="stat-icon w-14 h-14 rounded-full flex items-center justify-center text-xl"><i class="fa-solid fa-calendar-days"></i></div>
                </div>

                <div onclick="goToLeads('No Contact')" class="stat-card stat-nc p-4 rounded-2xl cursor-pointer flex justify-between items-center">
                    <div>
                        <h3 class="text-sm font-bold tracking-wide">No Contact</h3>
                        <p id="countNoContact" class="text-3xl font-black mt-1">0</p>
                    </div>
                    <div class="stat-icon w-14 h-14 rounded-full flex items-center justify-center text-xl"><i class="fa-solid fa-phone-slash"></i></div>
                </div>

                <div onclick="goToLeads('Closed')" class="stat-card stat-clo p-4 rounded-2xl cursor-pointer flex justify-between items-center">
                    <div>
                        <h3 class="text-sm font-bold tracking-wide">Closed</h3>
                        <p id="countClosed" class="text-3xl font-black mt-1">0</p>
                    </div>
                    <div class="stat-icon w-14 h-14 rounded-full flex items-center justify-center text-xl"><i class="fa-solid fa-circle-check"></i></div>
                </div>

                <div onclick="goToLeads('Not Interested')" class="stat-card stat-ni p-4 rounded-2xl cursor-pointer flex justify-between items-center">
                    <div>
                        <h3 class="text-sm font-bold tracking-wide">Not Interested</h3>
                        <p id="countNotInterested" class="text-3xl font-black mt-1">0</p>
                    </div>
                    <div class="stat-icon w-14 h-14 rounded-full flex items-center justify-center text-xl"><i class="fa-solid fa-ban"></i></div>
                </div>
            </div>
        </div>

        <!-- Recent Leads Preview Section -->
        <div class="glass p-4 rounded-3xl mb-6">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-900/10">
                <h3 class="text-xs font-bold text-sub uppercase tracking-wider">Recent Leads (Showing max 5)</h3>
                <a href="leads.html" class="text-[11px] text-acc font-bold hover:underline">View More <i class="fa-solid fa-arrow-right text-[9px]"></i></a>
            </div>
            
            <div id="leadsListContainer" class="space-y-3">
                <p class="text-xs text-sub2 text-center py-4">Loading sheet data...</p>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-900/10 text-center">
                <a href="leads.html" class="btn-link-wide inline-block w-full font-bold py-2.5 rounded-xl text-xs">
                    <i class="fa-solid fa-user-group mr-1.5"></i> View All Leads in Directory
                </a>
            </div>
        </div>
    </div>

    <!-- FLOATING "ADD LEAD" BUTTON -->
    <div class="fixed bottom-24 right-4 md:right-8 z-50">
        <button onclick="openAddModal()" class="btn-glass btn-fab font-bold px-4 py-3 rounded-full flex items-center space-x-2">
            <i class="fa-solid fa-plus text-base bg-white/25 p-1.5 rounded-full"></i>
            <span class="text-xs tracking-wide pr-1">Add Lead</span>
        </button>
    </div>

    <!-- Complete 28 Separate Fields Modal -->
    <div id="formModal" class="hidden fixed inset-0 bg-slate-900/25 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="glass-strong w-full max-w-lg md:max-w-3xl p-5 rounded-3xl my-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-900/10">
                <h3 id="formModalTitle" class="font-bold text-sm text-acc">Add New Lead (28 Fields)</h3>
                <button onclick="toggleFormModal()" class="text-sub hover:text-blue-800"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="leadForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="editLeadId">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">1. Sr No</label>
                        <input type="text" id="fSrNo" class="glass-input w-full px-2.5 py-1.5 text-xs" placeholder="Auto Sr No">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">2. CT Date</label>
                        <input type="date" id="fCtDate" required class="glass-input w-full px-2.5 py-1.5 text-xs">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">3. Unit</label>
                        <input type="text" id="fUnit" value="Mumbai-2" class="glass-input w-full px-2.5 py-1.5 text-xs" placeholder="Unit">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-amb uppercase mb-1">4. Customer Type</label>
                        <input type="text" id="fCustomerType" value="Prime" readonly class="glass-input w-full px-2.5 py-1.5 text-xs cursor-not-allowed font-semibold">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">5. Cust ID (If UH Allows)</label>
                        <input type="text" id="fCustId" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="glass-input w-full px-2.5 py-1.5 text-xs" placeholder="10-digit ID/Phone">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">6. Customer Name</label>
                        <input type="text" id="fCustomerName" required class="glass-input w-full px-2.5 py-1.5 text-xs" placeholder="Client Name">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-amb uppercase mb-1">7. Call/Meeting Type</label>
                        <input type="text" id="fCallMeetingType" value="Dialer/Call" readonly class="glass-input w-full px-2.5 py-1.5 text-xs cursor-not-allowed font-semibold">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-sub uppercase mb-1">8. Profiled RM Y/N</label>
                        <select id="fProfiledRM" class="glass-input w-full px-2.5 py-1.5 text-xs">
                            <option value="Y">Y</option>
                            <option value="N">N</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">9. Illustration sent</label>
                        <select id="fIllustration" class="glass-input w-full px-2.5 py-1.5 text-xs">
                            <option value="Y">Y</option>
                            <option value="N">N</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">10. F2F Done</label>
                        <select id="fF2F" class="glass-input w-full px-2.5 py-1.5 text-xs">
                            <option value="Y">Y</option>
                            <option value="N">N</option>
                            <option value="Teams call">Teams call</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">11. CRM Y/N</label>
                        <select id="fCrmYN" class="glass-input w-full px-2.5 py-1.5 text-xs">
                            <option value="Y">Y</option>
                            <option value="N">N</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">12. CRM If N - Reason</label>
                        <input type="text" id="fCrmReason" class="glass-input w-full px-2.5 py-1.5 text-xs" placeholder="Reason if N">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">13. Income Slab</label>
                        <input type="text" id="fIncomeSlab" class="glass-input w-full px-2.5 py-1.5 text-xs" placeholder="Income Slab">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">14. Customer A/C Bal / CC LIM / FD</label>
                        <input type="text" id="fAcBal" class="glass-input w-full px-2.5 py-1.5 text-xs" placeholder="Balance details">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">15. Premium Pitched</label>
                        <input type="text" id="fPremPitched" onblur="formatInputCurrency(this)" class="glass-input w-full px-2.5 py-1.5 text-xs" placeholder="1,00,000">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">16. Expected Premium</label>

                <div class="grid grid-cols-2 gap-2">

                <div class="grid grid-cols-2 gap-2">

                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">20. Followup Date</label>
                        <input type="date" id="fFollowupDate" class="glass-input w-full px-2.5 py-1.5 text-xs">

                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">21. FLS - Insurer</label>
                        <select id="fFLS" class="glass-input w-full px-2.5 py-1.5 text-xs">
                            <option value="Mahfuz">Mahfuz</option>
                            <option value="kishan">kishan</option>
                            <option value="Rehan">Rehan</option>
                            <option value="Dhirendra">Dhirendra</option>
                            <option value="Jitesh">Jitesh</option>
                            <option value="Sajan">Sajan</option>

                    <div>
                        <label class="block text-[10px] font-bold text-amb uppercase mb-1">22. CSM- Insurer</label>

                <div>

                <div class="grid grid-cols-2 gap-2">

                        <label class="block text-[8.5px] font-bold text-sub uppercase mb-1">24. L1 Insurer CSM/TM Spoken (CSM)</label>
                        <input type="text" id="fL1Spoken" class="glass-input w-full px-2.5 py-1.5 text-xs" placeholder="Yes / No">

                    <div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">26. RM Name</label>

                    <div>
                        <label class="block text-[10px] font-bold text-sub uppercase mb-1">27. VRBH</label>
                        <select id="fVRBH" class="glass-input w-full px-2 py-1.5 text-xs">
                            <option value="Rahul">Rahul</option>
                            <option value="Aarti">Aarti</option>
                            <option value="Kundan">Kundan</option>
                            <option value="TBA">TBA</option>
                            <option value="Minakshi">Minakshi</option>
                            <option value="Vikas">Vikas</option>
                            <option value="TBA2">TBA2</option>
                            <option value="Pritee">Pritee</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-amb uppercase mb-1">28. UH Name</label>
                        <input type="text" id="fUH" value="Amit Chodankar" readonly class="glass-input w-full px-2 py-1.5 text-xs cursor-not-allowed font-semibold">
                    </div>
                </div>

                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="toggleFormModal()" class="btn-glass btn-neutral w-1/2 font-semibold py-2 rounded-xl text-xs">Cancel</button>
                    <button type="submit" class="btn-glass btn-cyan w-1/2 font-extrabold py-2 rounded-xl text-xs">Save Lead</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="glass nav-glass nav-wrap fixed bottom-3 left-4 right-4 mx-auto px-2 py-2 flex justify-around items-center z-40">
        <a href="index.html" class="nav-item active text-acc flex flex-col items-center space-y-1">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="leads.html" class="nav-item text-sub hover:text-blue-800 flex flex-col items-center space-y-1">
            <i class="fa-solid fa-user-group text-base"></i>
            <span class="text-[10px] font-medium">Leads</span>
        </a>
        <a href="summary.html" class="nav-item text-sub hover:text-blue-800 flex flex-col items-center space-y-1 relative">
            <i class="fa-solid fa-list-check text-base"></i>
            <span class="absolute -top-1 -right-1 bg-rose-500/90 text-on text-[9px] font-bold px-1 rounded-full shadow" id="badgeCount">0</span>
            <span class="text-[10px] font-medium">Summary</span>
        </a>
        <a href="calendar.html" class="nav-item text-sub hover:text-blue-800 flex flex-col items-center space-y-1">
            <i class="fa-solid fa-calendar text-base"></i>
            <span class="text-[10px] font-medium">Calendar</span>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxot3Icntv6plIlm1q-V62facX6LT6EuTXKBiVvrXXfN_gi33wZZMByeMQuV8FMfyVqvQ/exec";
        let leads = [];

        window.onload = function() {
            fetchLeadsFromSheet();
        };

        function formatIndianCurrency(numStr) {
            if (!numStr) return '';
            let cleanNum = numStr.toString().replace(/[^0-9]/g, '');
            if (cleanNum === '') return '';
            let x = cleanNum;
            let lastThree = x.substring(x.length - 3);
            let otherNumbers = x.substring(0, x.length - 3);
            if (otherNumbers != '') {
                lastThree = ',' + lastThree;
            }
            return otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
        }

        function formatInputCurrency(input) {
            if (input.value) {
                input.value = formatIndianCurrency(input.value);
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                let d = new Date(dateString);
                if (isNaN(d.getTime())) return dateString;
                let day = String(d.getDate()).padStart(2, '0');
                let month = String(d.getMonth() + 1).padStart(2, '0');
                let year = d.getFullYear();
                return `${day}-${month}-${year}`;
            } catch (e) {
                return dateString;
            }
        }

        async function fetchLeadsFromSheet() {
            try {
                let response = await fetch(WEB_APP_URL);
                let data = await response.json();
                
                leads = data.map((item, index) => ({
                    id: item.id || (index + 1),
                    sNo: item["Sr No"] || item.sNo || (index + 1),
                    ctDate: item["CT Date"] || item.ctDate || "",
                    unit: item["Unit"] || item.unit || "Mumbai-2",
                    customerType: item["Customer Type"] || item.customerType || "Prime",
                    custId: item["Cust ID (If UH Allows)"] || item.custId || "",
                    customerName: item["Customer Name"] || item.customerName || "",
                    callMeetingType: item["Call/Meeting Type"] || item.callMeetingType || "Dialer/Call",
                    profiledRm: item["Profiled & CT Trasnfer by RM Y/N"] || item.profiledRm || "Y",
                    illustration: item["Illustration sent"] || item.illustration || "Y",
                    f2f: item["F2F Done"] || item.f2f || "Y",
                    crmYn: item["CRM Y/N"] || item.crmYn || "Y",
                    crmReason: item["CRM If N - Reason"] || item.crmReason || "",
                    incomeSlab: item["Income Slab"] || item.incomeSlab || "",
                    acBal: item["Customer A/C Bal / CC LIM / FD"] || item.acBal || "",
                    premPitched: item["Premium Pitched"] || item.premPitched || "",
                    expectedPremium: item["Expected Premium"] || item.expectedPremium || "",
                    planPitched: item["Plan Pitched"] || item.planPitched || "",
                    status: item["CT/Lead Status"] || item.status || "New Lead",
                    vrbhInformed: item["IF NI/NC Lead Is VRBH/UH Informed"] || item.vrbhInformed || "Y",
                    followupDate: item["Followup Date"] || item.followupDate || "",
                    fls: item["FLS - Insurer"] || item.fls || "Mahfuz",
                    csmInsurer: item["CSM- Insurer"] || item.csmInsurer || "ABSLI",
                    remark: item["FLS Detailed Lead Remark & Date"] || item.remark || "",
                    l1Spoken: item["L1 Insurer CSM/TM Spoken to Customer (CSM)"] || item.l1Spoken || "",
                    l1Remarks: item["LI 1 Insurer CSM/ TM Lead Remaks"] || item["LI 1 Insurer CSM/ TM Lead Remarks"] || item.l1Remarks || "",
                    rmName: item["RM Name"] || item.rmName || "",
                    vrbh: item["VRBH"] || item.vrbh || "Rahul",
                    uhName: item["UH Name"] || item.uhName || "Amit Chodankar"
                }));

                renderRecentLeads();
                updateStats();
            } catch (error) {
                console.error("Error fetching from sheet:", error);
                document.getElementById('leadsListContainer').innerHTML = `<p class="text-xs text-ros text-center py-4">Failed to load leads from sheet.</p>`;
            }
        }

        function goToLeads(status) {
            window.location.href = `leads.html?status=${encodeURIComponent(status)}`;
        }

        function openAddModal() {
            document.getElementById('leadForm').reset();
            document.getElementById('editLeadId').value = '';
            document.getElementById('fSrNo').value = leads.length + 1;
            
            // Auto-fill current date in CT Date field (Changeable)
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('fCtDate').value = `${year}-${month}-${day}`;

            document.getElementById('fUnit').value = 'Mumbai-2';
            document.getElementById('fCustomerType').value = 'Prime';
            document.getElementById('fCallMeetingType').value = 'Dialer/Call';
            document.getElementById('fCsmInsurer').value = 'ABSLI';
            document.getElementById('fUH').value = 'Amit Chodankar';
            document.getElementById('fStatus').value = 'New Lead';
            document.getElementById('fVrbhInformed').value = 'Y';
            document.getElementById('formModalTitle').innerText = 'Add New Lead (28 Fields)';
            toggleFormModal();
        }

        function editLead(id) {
            let lead = leads.find(l => l.id == id || l.sNo == id);
            if (!lead) return;

            document.getElementById('editLeadId').value = lead.id;
            document.getElementById('fSrNo').value = lead.sNo || '';
            document.getElementById('fCtDate').value = lead.ctDate ? lead.ctDate.split('T')[0] : '';
            document.getElementById('fUnit').value = lead.unit || 'Mumbai-2';
            document.getElementById('fCustomerType').value = 'Prime';
            document.getElementById('fCustId').value = lead.custId || '';
            document.getElementById('fCustomerName').value = lead.customerName || '';
            document.getElementById('fCallMeetingType').value = 'Dialer/Call';
            document.getElementById('fProfiledRM').value = lead.profiledRm || 'Y';
            document.getElementById('fIllustration').value = lead.illustration || 'Y';
            document.getElementById('fF2F').value = lead.f2f || 'Y';
            document.getElementById('fCrmYN').value = lead.crmYn || 'Y';
            document.getElementById('fCrmReason').value = lead.crmReason || '';
            document.getElementById('fIncomeSlab').value = lead.incomeSlab || '';
            document.getElementById('fAcBal').value = lead.acBal || '';
            document.getElementById('fPremPitched').value = lead.premPitched || '';
            document.getElementById('fExpPremium').value = lead.expectedPremium || '';
            document.getElementById('fPlanPitched').value = lead.planPitched || '';
            document.getElementById('fStatus').value = lead.status || 'New Lead';
            document.getElementById('fVrbhInformed').value = lead.vrbhInformed || 'Y';
            document.getElementById('fFollowupDate').value = lead.followupDate ? lead.followupDate.split('T')[0] : '';
            document.getElementById('fFLS').value = lead.fls || 'Mahfuz';
            document.getElementById('fCsmInsurer').value = 'ABSLI';
            document.getElementById('fRemark').value = lead.remark || '';
            document.getElementById('fL1Spoken').value = lead.l1Spoken || '';
            document.getElementById('fL1Remarks').value = lead.l1Remarks || '';
            document.getElementById('fRM').value = lead.rmName || '';
            document.getElementById('fVRBH').value = lead.vrbh || 'Rahul';
            document.getElementById('fUH').value = 'Amit Chodankar';

            document.getElementById('formModalTitle').innerText = 'Edit Lead Details';
            toggleFormModal();
        }

        async function deleteLead(id) {
            if(!confirm("Kya aap sach me is lead ko delete karna chahte hain?")) return;

            document.getElementById('leadsListContainer').innerHTML = `<p class="text-xs text-ros text-center py-4">Deleting entry from sheet...</p>`;
            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "delete", id: id })
                });
                fetchLeadsFromSheet();
            } catch (error) {
                console.error("Error deleting lead:", error);
                alert("Failed to delete entry!");
            }
        }

        function toggleFormModal() {
            document.getElementById('formModal').classList.toggle('hidden');
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const editId = document.getElementById('editLeadId').value;
            
            const leadData = {
                id: editId ? editId : Date.now(),
                sNo: document.getElementById('fSrNo').value || (leads.length + 1),
                ctDate: document.getElementById('fCtDate').value,
                unit: document.getElementById('fUnit').value,
                customerType: "Prime",
                custId: document.getElementById('fCustId').value,
                customerName: document.getElementById('fCustomerName').value,
                callMeetingType: "Dialer/Call",
                profiledRm: document.getElementById('fProfiledRM').value,
                illustration: document.getElementById('fIllustration').value,
                f2f: document.getElementById('fF2F').value,
                crmYn: document.getElementById('fCrmYN').value,
                crmReason: document.getElementById('fCrmReason').value,
                incomeSlab: document.getElementById('fIncomeSlab').value,
                acBal: document.getElementById('fAcBal').value,
                premPitched: formatIndianCurrency(document.getElementById('fPremPitched').value),
                expectedPremium: formatIndianCurrency(document.getElementById('fExpPremium').value),
                planPitched: document.getElementById('fPlanPitched').value,
                status: document.getElementById('fStatus').value,
                vrbhInformed: document.getElementById('fVrbhInformed').value,
                followupDate: document.getElementById('fFollowupDate').value,
                fls: document.getElementById('fFLS').value,
                csmInsurer: "ABSLI",
                remark: document.getElementById('fRemark').value,
                l1Spoken: document.getElementById('fL1Spoken').value,
                l1Remarks: document.getElementById('fL1Remarks').value,
                rmName: document.getElementById('fRM').value,
                vrbh: document.getElementById('fVRBH').value,
                uhName: "Amit Chodankar"
            };

            toggleFormModal();
            document.getElementById('leadsListContainer').innerHTML = `<p class="text-xs text-acc text-center py-4">Saving entry to Google Sheet...</p>`;

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "save", lead: leadData })
                });
                fetchLeadsFromSheet();
            } catch (error) {
                console.error("Error saving lead:", error);
                alert("Error saving data!");
            }
        }

        function renderRecentLeads() {
            const container = document.getElementById('leadsListContainer');
            container.innerHTML = '';
            let limitedLeads = leads.slice(0, 5);

            if (limitedLeads.length === 0) {
                container.innerHTML = `<p class="text-xs text-sub2 text-center py-4">No leads found in sheet.</p>`;
                return;
            }

            limitedLeads.forEach(lead => {
                let badgeColor = 'badge-default';
                let currentStatus = (lead.status || '').toLowerCase();

                if(currentStatus.includes('new')) badgeColor = 'badge-new';
                else if(currentStatus.includes('follow')) badgeColor = 'badge-follow';
                else if(currentStatus.includes('no contact')) badgeColor = 'badge-nc';
                else if(currentStatus.includes('close')) badgeColor = 'badge-closed';
                else if(currentStatus.includes('not') || currentStatus.includes('reject')) badgeColor = 'badge-ni';

                let formattedExpPrem = lead.expectedPremium ? formatIndianCurrency(lead.expectedPremium) : '0';

                const card = document.createElement('div');
                card.className = "glass-card p-3.5 rounded-2xl flex flex-col space-y-2.5 text-xs";
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <h4 class="font-extrabold text-base text-ink tracking-tight">${lead.customerName || 'N/A'}</h4>
                            <p class="text-sub mt-0.5"><i class="fa-solid fa-id-badge text-[10px] mr-1 text-emr"></i><span class="text-ink font-semibold">${lead.custId || 'N/A'}</span> | <i class="fa-solid fa-location-dot ml-1"></i> ${lead.unit || 'Mumbai-2'}</p>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <span class="badge text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}">${lead.status || 'N/A'}</span>
                            <button onclick="editLead('${lead.id}')" class="icon-btn edit">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button onclick="deleteLead('${lead.id}')" class="icon-btn del">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <div class="glass-inset grid grid-cols-2 gap-1.5 p-2.5 rounded-xl text-[11px] text-sub">
                        <div><b>CT Date:</b> <span class="text-emr font-semibold">${formatDate(lead.ctDate)}</span></div>
                        <div><b>VRBH:</b> <span class="text-amb font-semibold">${lead.vrbh || '-'}</span></div>
                        <div><b>FLS:</b> <span class="text-acc font-semibold">${lead.fls || 'N/A'}</span></div>
                        <div><b>Exp. Premium:</b> ₹${formattedExpPrem}</div>
                        <div class="col-span-2 text-acc"><b>Plan:</b> ${lead.planPitched || 'N/A'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateStats() {
            const total = leads.length;
            
            const newLeadCount = leads.filter(l => (l.status || '').toLowerCase().includes('new')).length;
            const followupCount = leads.filter(l => (l.status || '').toLowerCase().includes('follow')).length;
            const noContactCount = leads.filter(l => (l.status || '').toLowerCase().includes('no contact')).length;
            const closedCount = leads.filter(l => (l.status || '').toLowerCase().includes('close')).length;
            const notInterestedCount = leads.filter(l => (l.status || '').toLowerCase().includes('not')).length;

            document.getElementById('countNewLead').innerText = newLeadCount;
            document.getElementById('countFollowup').innerText = followupCount;
            document.getElementById('countNoContact').innerText = noContactCount;
            document.getElementById('countClosed').innerText = closedCount;
            document.getElementById('countNotInterested').innerText = notInterestedCount;
            document.getElementById('badgeCount').innerText = followupCount;

            const conversionRate = total > 0 ? Math.round((closedCount / total) * 100) : 0;
            document.getElementById('conversionPercentText').innerText = conversionRate + '%';
            document.getElementById('gaugePath').setAttribute('stroke-dasharray', `${conversionRate}, 100`);
        }

        function exportToCSV() {
            if (leads.length === 0) { alert('No data to export.'); return; }
            let csv = "Sr No,CT Date,Unit,Customer Type,Cust ID (If UH Allows),Customer Name,Call/Meeting Type,Profiled & CT Trasnfer by RM Y/N,Illustration sent,F2F Done,CRM Y/N,CRM If N - Reason,Income Slab,Customer A/C Bal / CC LIM / FD,Premium Pitched,Expected Premium,Plan Pitched,CT/Lead Status,IF NI/NC Lead Is VRBH/UH Informed,Followup Date,FLS - Insurer,CSM- Insurer,FLS Detailed Lead Remark & Date,L1 Insurer CSM/TM Spoken to Customer (CSM),LI 1 Insurer CSM/ TM Lead Remaks,RM Name,VRBH,UH Name\n";
            leads.forEach(l => {
                csv += `"${l.sNo || ''}","${l.ctDate || ''}","${l.unit || 'Mumbai-2'}","${l.customerType || 'Prime'}","${l.custId || ''}","${l.customerName || ''}","${l.callMeetingType || 'Dialer/Call'}","${l.profiledRm || ''}","${l.illustration || ''}","${l.f2f || ''}","${l.crmYn || ''}","${l.crmReason || ''}","${l.incomeSlab || ''}","${l.acBal || ''}","${l.premPitched || ''}","${l.expectedPremium || ''}","${l.planPitched || ''}","${l.status || ''}","${l.vrbhInformed || ''}","${l.followupDate || ''}","${l.fls || ''}","${l.csmInsurer || 'ABSLI'}","${l.remark || ''}","${l.l1Spoken || ''}","${l.l1Remarks || ''}","${l.rmName || ''}","${l.vrbh || ''}","${l.uhName || 'Amit Chodankar'}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "sheet_leads_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
